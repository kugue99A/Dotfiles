[tools]
# Node.js - 最新のLTS版を使用
nodejs = "24"
"aqua:pnpm/pnpm" = "latest"  # 署名検証済みネイティブ配布物を使用
bun = "latest"   # opensessions等で使用

# 開発で使用する言語とツール
go = "latest"
python = "latest"
lua = "5.4"  # 安定版を使用（5.5.0はLuaRocksとの互換性問題あり）

# 便利なCLIツール
ripgrep = "latest"
fd = "latest"
bat = "latest"
fzf = "latest"
bottom = "latest"  # システムモニター (btm コマンド)
herdr = "latest"   # ターミナル向けエージェントマルチプレクサ (https://github.com/ogulcancelik/herdr)
hunk = "latest"    # レビュー特化のTUI diffビューア (https://github.com/modem-dev/hunk)
opencode = "latest" # ローカルLLMを利用するHerdr対応コーディングエージェント

# Language Servers for Neovim
# TypeScript Language Server via npm
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"

# TypeSpec Language Server
"npm:@typespec/compiler" = "latest"

# Code Formatters and Linters
# JavaScript/TypeScript formatters
"npm:@biomejs/biome" = "latest"
"npm:prettier" = "latest"
"npm:eslint_d" = "latest"

# CSS/SCSS formatters
"npm:stylelint" = "latest"
"npm:stylelint-config-standard" = "latest"

# Python package management
uv = "latest"

# Lua formatter
"cargo:stylua" = "latest"
"go:github.com/d-kuro/gwq/cmd/gwq" = "latest"

# Codex CLI is installed globally with npm under mise-managed Node.js.

[env]
# 共通の環境変数
EDITOR = "nvim"
VISUAL = "nvim"
# Codex is npm-installed under Node 24.19. Keep it visible to `mise exec`
# even when the selected Node 24 patch version changes.
_.path = ["~/.local/share/mise/installs/node/24.19.0/bin"]

[settings]
# 実験的機能を有効化
experimental = true
# Resolve versions from upstream; the shared index listed missing OpenCode releases.
use_versions_host = false

[settings.github]
# Fetch credentials only when GitHub access is needed, not on every shell hook.
credential_command = "gh auth token 2>/dev/null || true"

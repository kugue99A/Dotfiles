gui:
  colorScheme: light
  theme:
    activeBorderColor:
      - '#637c8d'
      - bold
    inactiveBorderColor:
      - '#8a9296'
    selectedLineBgColor:
      - '#e8e4eb'
    selectedLineFgColor:
      - '#39434a'
    defaultFgColor:
      - '#39434a'
    unstagedChangesColor:
      - '#52735f'
git:
  diffRenderers:
    - colorArg: always
      useConfig: true
      type: rawGit
